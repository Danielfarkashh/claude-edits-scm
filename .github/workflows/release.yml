name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test-hunks.js 5000
      - run: node test-win32.js
      - run: node test-title.js
      - run: node test-delta.js
      - run: node test-attrib.js 2000
      - run: node test-bashfirst.js
      - run: node test-commit.js
      - run: npm install
      - run: npm run package
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" *.vsix --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # Trusted Publishing: no PAT; the Marketplace policy trusts this repo + release.yml.
      - name: Publish to VS Code Marketplace
        run: npx -y @vscode/vsce@4.1.0 publish --oidc --packagePath *.vsix
